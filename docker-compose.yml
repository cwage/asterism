# NOTE: no `user:` override on these services — this host runs rootless docker,
# where container root maps to the host user (bind-mounted files come out owned
# by you), and a user: 1000 override maps to an unwritable subuid instead.
# If deploying somewhere with rootful docker, add:
#   user: "${UID:-1000}:${GID:-1000}"
services:
  web:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./indexes:/indexes:ro
      - ./catalogs:/catalogs:ro
      # Frontend work: static/ is baked into the image, so without this a
      # one-line CSS tweak needs a rebuild. main.py reads index.html per
      # request, so with the mount a browser refresh is enough.
      - ./static:/srv/static:ro
    environment:
      - DATA_DIR=/data

  worker:
    # LLM narration (#12) needs ANTHROPIC_API_KEY and satellite crossings
    # (#11) need SPACETRACK_USER/PASS; unset just disables those layers.
    # Same for NTFY_TOPIC_URL and activity notifications (#69) — the knobs
    # are passed through so a local run can exercise them without a rebuild.
    build:
      context: .
      target: app
    # -u to match scripts/start-all.sh: without it the worker's prints sit
    # in a block buffer and `docker compose logs worker` stays empty until
    # shutdown, which hides exactly the lines you started it to watch.
    command: python -u -m app.worker
    volumes:
      - ./data:/data
      - ./indexes:/indexes:ro
      - ./catalogs:/catalogs:ro
      - ./photos:/photos:ro
    environment:
      - DATA_DIR=/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SPACETRACK_USER=${SPACETRACK_USER:-}
      - SPACETRACK_PASS=${SPACETRACK_PASS:-}
      - NTFY_TOPIC_URL=${NTFY_TOPIC_URL:-}
      - NTFY_BURST_SOLVES=${NTFY_BURST_SOLVES:-}
      - NTFY_BURST_WINDOW_MINUTES=${NTFY_BURST_WINDOW_MINUTES:-}
      - NTFY_SUMMARY_HOUR_UTC=${NTFY_SUMMARY_HOUR_UTC:-}
      - NTFY_TICK_SECONDS=${NTFY_TICK_SECONDS:-}
