# Fly.io deploy (#8): single app, one machine running web + worker
# together so they share the SQLite volume. Sky data is baked into the
# release image; only /data persists.
app = "asterism"
primary_region = "iad"

[build]
  build-target = "release"

[processes]
  app = "bash scripts/start-all.sh"

[mounts]
  source = "asterism_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  # Dedicated CPUs, not shared (2026-08-19): solve-field pegs the CPU for
  # its whole budget, so a busy night drains a shared VM's burst credits
  # and every later solve runs ~5x slower — the queue backs up exactly
  # when the site is being used. performance-2x needs >= 4gb.
  size = "performance-2x"
  memory = "4gb"
