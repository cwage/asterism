# Fly.io deploy (#8): single app, one machine running web + worker
# together so they share the SQLite volume. Sky data is baked into the
# release image; only /data persists.
app = "asterism"
primary_region = "iad"

[build]
  build-target = "release"

[processes]
  app = "bash scripts/start-all.sh"

[mounts]
  source = "asterism_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
