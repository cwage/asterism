<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asterism</title>
<style>
  body { background: #0b0e14; color: #cdd6e0; font-family: system-ui, sans-serif;
         max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-weight: 400; letter-spacing: 0.3em; }
  #status { margin: 1rem 0; color: #8fa1b3; }
  #wrap { position: relative; display: inline-block; max-width: 100%; }
  #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #wrap img { display: block; max-width: 100%; }
</style>
</head>
<body>
<h1>asterism</h1>
<p>Upload a night-sky photo; get back what's in it.</p>
<input type="file" id="file" accept="image/*">
<div id="status"></div>
<div id="wrap"><img id="photo" hidden><canvas id="overlay"></canvas></div>

<script>
const status = (m) => document.getElementById('status').textContent = m;

document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('image', f);
  status('uploading…');
  const res = await fetch('/jobs', { method: 'POST', body: fd });
  if (!res.ok) { status('upload failed: ' + await res.text()); return; }
  const { id } = await res.json();
  poll(id);
});

// Deep-link an existing job: /?job=<id> renders it without re-uploading.
const jobParam = new URLSearchParams(location.search).get('job');
if (jobParam) poll(jobParam);

async function poll(id) {
  status('solving…');
  const t0 = Date.now();
  while (true) {
    const job = await (await fetch('/jobs/' + id)).json();
    if (job.status === 'done') { render(id, job); return; }
    if (job.status === 'failed') { status('solve failed — ' + (job.error || 'unknown')); return; }
    status(`solving… (${Math.round((Date.now() - t0) / 1000)}s)`);
    await new Promise(r => setTimeout(r, 2000));
  }
}

function render(id, job) {
  const img = document.getElementById('photo');
  const canvas = document.getElementById('overlay');
  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    const scale = img.naturalWidth / 1000;  // keep label size sane on big photos
    const colors = { star: 'rgba(120, 200, 255, 0.9)',
                     planet: 'rgba(255, 200, 90, 0.95)',
                     moon: 'rgba(255, 235, 170, 0.95)' };
    // Constellation figures go down first, under the labels.
    const figures = job.result.constellations || [];
    ctx.strokeStyle = 'rgba(150, 170, 210, 0.35)';
    ctx.lineWidth = Math.max(1, 1.5 * scale);
    ctx.fillStyle = 'rgba(150, 170, 210, 0.6)';
    ctx.font = `italic ${Math.max(13, 15 * scale)}px system-ui`;
    for (const c of figures) {
      ctx.beginPath();
      for (const [x1, y1, x2, y2] of c.segments) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
      ctx.stroke();
      const pts = c.segments.flatMap(([x1, y1, x2, y2]) => [[x1, y1], [x2, y2]])
        .filter(([x, y]) => x >= 0 && x < canvas.width && y >= 0 && y < canvas.height);
      if (pts.length) {
        const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
        const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
        ctx.fillText(c.name, cx, cy);
      }
    }

    ctx.font = `${Math.max(14, 16 * scale)}px system-ui`;
    ctx.lineWidth = Math.max(1, scale);
    let bodies = 0, hidden = 0;
    for (const l of job.result.labels) {
      const kind = l.kind || 'star';
      if (kind !== 'star') bodies++;
      // 'hidden': verification found no star at this spot (cloud, most
      // likely) — keep the label but make its uncertainty visible.
      const dim = l.status === 'hidden';
      if (dim) hidden++;
      ctx.globalAlpha = dim ? 0.4 : 1;
      ctx.setLineDash(dim ? [5 * scale, 5 * scale] : []);
      ctx.strokeStyle = colors[kind] || colors.star;
      ctx.fillStyle = colors[kind] || colors.star;
      ctx.beginPath();
      const r = kind === 'star' ? Math.max(6, 8 * scale) : Math.max(9, 12 * scale);
      ctx.arc(l.x, l.y, r, 0, 2 * Math.PI);
      ctx.stroke();
      let text = l.name;
      if (kind === 'moon' && l.phase != null) text += ` (${Math.round(l.phase * 100)}% lit)`;
      ctx.fillText(text, l.x + (r + 4) * Math.max(1, scale), l.y - 8 * scale);
    }
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    const parts = [`${job.result.labels.length - bodies} stars`];
    if (bodies) parts.push(`${bodies} solar-system ${bodies === 1 ? 'body' : 'bodies'}`);
    if (figures.length) parts.push(`${figures.length} constellation${figures.length === 1 ? '' : 's'}`);
    const notes = [];
    if (hidden) notes.push(`${hidden} hidden by cloud`);
    const v = job.result.verification;
    if (v && v.warped) notes.push('image stacking warp corrected');
    status(`solved in ${job.solve_seconds}s — labeled ${parts.join(', ')}`
           + (notes.length ? ` (${notes.join('; ')})` : ''));
  };
  img.hidden = false;
  img.src = '/jobs/' + id + '/image';
}
</script>
</body>
</html>
